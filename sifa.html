<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>СИФА 💩</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#12100e;color:#eee;
    font-family:"Segoe UI",system-ui,sans-serif;user-select:none}
  .hidden{display:none !important}
  #menu{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;padding:20px;overflow-y:auto;
    background:radial-gradient(circle at 50% 25%,#3a2a18,#100c08 72%)}
  h1{margin:0;font-size:clamp(32px,7vw,58px);letter-spacing:8px;color:#e8b96a;
    text-shadow:0 5px 0 #00000066}
  .step{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
  .step p{margin:0;opacity:.75;font-size:15px;text-align:center;max-width:640px}
  .mode-btn{font:800 20px inherit;padding:18px 40px;border-radius:16px;min-width:320px;
    background:#241b12;color:#e8b96a;border:2px solid #4a3826;cursor:pointer;
    transition:.15s;letter-spacing:1px}
  .mode-btn small{display:block;font:400 13px inherit;opacity:.6;margin-top:4px}
  .mode-btn:hover{background:#3a2a18;border-color:#e8b96a;transform:translateY(-3px)}
  #game{display:grid;grid-template-rows:58px 1fr 158px;height:100vh}
  #hud{position:relative;display:flex;align-items:center;justify-content:center;
    background:#1c1712;border-bottom:2px solid #3a2e22;font-weight:900;
    font-size:clamp(18px,3.4vw,28px);letter-spacing:2px;overflow:hidden;white-space:nowrap}
  #hud-text{animation:fl .6s steps(1,end) infinite}
  @keyframes fl{50%{opacity:.12}}
  #hud-you{position:absolute;left:14px;top:50%;transform:translateY(-50%);
    font-size:14px;font-weight:700;letter-spacing:0;opacity:.8;color:#cbb68a;
    white-space:nowrap;max-width:36vw;overflow:hidden;text-overflow:ellipsis}
  #stage{position:relative;overflow:hidden;
    background:radial-gradient(circle at 50% 40%,#2e4026,#141d0e 72%)}
  canvas{display:block;cursor:crosshair}
  #chat{background:#1c1712;border-top:2px solid #3a2e22;display:flex;flex-direction:column;min-height:0}
  #msgs{flex:1;overflow-y:auto;padding:6px 12px;font-size:14px;line-height:1.35}
  #msgs div{margin-bottom:2px;word-wrap:break-word}
  #msgs .sys{color:#ffd166;font-weight:800}
  #say-row{border-top:1px solid #2c231a;padding:6px}
  #say-input{width:100%;background:#120e09;border:1px solid #3a2e22;border-radius:8px;
    color:#eee;padding:7px 10px;font:14px inherit;outline:none}
  #say-input:focus{border-color:#e8b96a}
  #msgs::-webkit-scrollbar{width:8px}
  #msgs::-webkit-scrollbar-thumb{background:#3a2e22;border-radius:4px}
  #toggles{position:fixed;top:10px;right:10px;z-index:20;display:flex;gap:6px}
  .toggle{background:#1c1712cc;border:1px solid #4a3826;color:#e8b96a;border-radius:8px;
    padding:6px 10px;font:600 13px inherit;cursor:pointer;backdrop-filter:blur(4px)}
  .toggle:hover{border-color:#e8b96a}
  .toggle.off{color:#666;border-color:#333}
</style>
</head>
<body>

<div id="toggles">
  <button id="music-toggle" class="toggle" title="Музыка">🔊 музыка</button>
  <button id="sound-toggle" class="toggle" title="Звуки">🔔 звуки</button>
</div>

<div id="game">
  <div id="hud">
    <span id="hud-you"></span>
    <span id="hud-text">СИФА</span>
  </div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="chat">
    <div id="msgs"></div>
    <div id="say-row"><input id="say-input" maxlength="60" placeholder="крикнуть в чат... (Enter)"></div>
  </div>
</div>

<div id="menu">
  <h1>СИФА 💩</h1>
  <div class="step">
    <p>Команда формируется случайно. Тебе выпадет имя и эмодзи.<br>
       Кто попал сифой — тот водит. Бей мышью, бегай на WASD.</p>
    <button class="mode-btn" data-count="12">Малая команда <small>12 игроков</small></button>
    <button class="mode-btn" data-count="24">Большая команда <small>24 игрока</small></button>
  </div>
</div>

<audio id="bgm" loop preload="none">
  <source src="music/background.ogg" type="audio/ogg">
  <source src="music/background.mp3" type="audio/mpeg">
</audio>

<script>
(() => {
'use strict';

/* ================================================================
   ██████  КОНФИГ — ВСЁ ЗДЕСЬ  ██████
   ================================================================ */
const CONFIG = {

  sound: {
    enabled: true,
    master:  0.70,

    /* ---- ВЫСТРЕЛ (бросок сифы) — играется ОДИН случайный из пула ---- */
    throw: {
      volume:   0.35,   // громкость
      cooldown: 55,     // мс между звуками (защита от наложения)
      pool: [           // какие звуки могут выпасть:
        'pop',          // короткий синус-«поп»
        'flick',        // резкий щелчок белым шумом
        'bloop',        // синус вверх-вниз
        'thwip',        // свист-шум (2200→300 Гц)
        'poot',         // низкий квадратный «пуф»
        'toss',         // мягкий треугольник
        'swoosh',       // двухслойный шумовой свист
        'pew',          // лазерный (пила 1200→220)
        'snap',         // резкий щелчок + клик
        'spring'        // пружинка (300→900→150)
      ]
    },

    hit:       { volume: 0.55, cooldown: 80  },
    miss:      { volume: 0.25, cooldown: 200 },
    banner:    { volume: 0.14, cooldown: 400 },
    gameStart: { volume: 0.30 },
    sifaSwap:  { volume: 0.40 },

    airRaid:   { volume: 0.14, duration: 6.0 },
    samovar:   { volume: 0.16, duration: 4.0 },

    random: {
      enabled: true,
      minInterval: 4,
      maxInterval: 12,
      volume: 0.13,
      pool: ['blip','beep','whoosh','boing','ping','tick','chime','rumble']
    }
  },

  music: {
    enabled:     true,
    baseVolume:  0.30,
    duckedVolume: 0.06
  },

  timing: {
    eventMin:  15*60,
    eventMax:  45*60,
    bannerMin: 6*60,
    bannerMax: 18*60,
    bannerDur: 150
  }
};
/* ================================================================ */


/* ======================== ИМЕНА И ЭМОДЗИ ======================== */
const ALL_NAMES = [
  'Саша','Петя','Козёл','Мууд','Витя Говнн','Лёха',
  'Натаха','Боров','Шмыг','Гуля','Пельмень','Батя',
  'Гена','Зина','Толик','Вован','Семён','Дед',
  'Бабуля','Кузьмич','Федя','Профессор','Малыш','Хомяк',
  'Ослан','Козлан','Анна Ивановна','Петерсон','Галиматья','Брежнев',
  'ВЦЫ','МСО','ЗППУ','Чисорка','Борис-Борис у кота яйца отгрыз',
  'Динамо','Лещ','Скукоженный','Валя','Юлечка','Зорик','Борисовна'
];
const ALL_EMOJIS = [
  '😀','😎','🤪','🥸','🤠','👽','🤖','🐸','🐷','🦊','🐵','👺',
  '🐔','🐧','🦁','🐯','🐨','🐼','🐹','🐰','🦝','🐙','🦄','👻',
  '🐺','🦉','🦅','🐗','🦌','🐻','🐭','🐮','🐒','🦆','🐲','🦖',
  '👹','👾','👿','🧟','🧛','🧙'
];
const PAIRS = ALL_NAMES.map((name, i) => ({
  name, emoji: ALL_EMOJIS[i % ALL_EMOJIS.length]
}));

const PHRASES = [
  'я не сифа!','лови его!','фууу, сифа','это не я!!','бегите!','кто сифа?',
  'сифа летит!','ой','мама','не в меня!!!','я чистый','пахнет тут...',
  'сифа у него!','спасайся!','я мылся сегодня','не догонишь!','оно летит',
  'аааа','я в домике','нечестно!','кидай в Петю','это Козёл, точно'
];
const RAID_PHRASES = ['аэробанан!','в укрытие!!','оно с неба!!','спасайся кто может!!','тревога!!'];
const SAMOVAR_PHRASES = ['самовар!!!','оно кипит!','говно повсюду!!','не смотри на него!!','буль-буль'];

const BANNERS = [
  { text: 'внимание! вспышка на солнце',         color: '#ffdd66', effect: 'sun' },
  { text: 'впереди красный',                     color: '#ff5555', effect: 'flash-ahead-red' },
  { text: 'вспышка справа',                      color: '#ffffff', effect: 'flash-right' },
  { text: 'вспышка слева',                       color: '#ffffff', effect: 'flash-left' },
  { text: 'не бери говно руками',                color: '#c89a5a' },
  { text: 'чушуя, чешуя',                        color: '#88cc88' },
  { text: 'индейцы в 12 километрах от города',   color: '#cc8844' },
  { text: 'юра - в космосе!',                    color: '#aaccff' },
  { text: 'возьми!',                             color: '#ffcc44' },
  { text: 'осторожно с лещами',                  color: '#88ccff' },
  { text: 'кпсу!',                               color: '#ff8888' },
  { text: 'ББР!',                                color: '#ffaa44' },
  { text: 'Бобры в нападении!',                  color: '#c8845a' },
  { text: 'ёбс тудэй!!!',                        color: '#ff66aa' },
  { text: 'нормально, э!',                       color: '#aaddaa' },
  { text: 'аэровафли! тревога!',                 color: '#ffdd88' },
  { text: 'впереди синий',                       color: '#6666ff', effect: 'flash-ahead-blue' }
];

/* ======================== БАЛАНС ======================== */
const R          = 24;
const SR         = 15;
const SIFA_SPEED = 15.5;
const SPEED_RUN  = 2.9;
const SPEED_HOLD = 2.9;
const HITBOX     = R + SR;
const SIFA_LIFE  = 90;

const AI_DODGE_RADIUS = 140;
const AI_DODGE_WIDTH  = 45;
const AI_DODGE_POWER  = 1.6;

const AIM_ASSIST_ANGLE = 0.40;
const AIM_ASSIST_RANGE = 500;

/* ======================== УТИЛИТЫ ======================== */
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const rnd   = (a,b) => a + Math.random()*(b-a);
const pick  = a => a[(Math.random()*a.length)|0];
function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = (Math.random()*(i+1))|0;
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function shortName(n){ return n.length <= 14 ? n : n.slice(0, 12) + '…'; }

/* ================================================================
   ЗВУКОВОЙ ДВИЖОК (Web Audio API)
   ================================================================ */
let audioCtx   = null;
let masterGain = null;

function getAudio(){
  if (!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    audioCtx = new AC();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = CONFIG.sound.enabled ? CONFIG.sound.master : 0;
    masterGain.connect(audioCtx.destination);
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

/* Мини-хелпер: осциллятор */
function playOsc(type, freq, dur, vol, opts = {}){
  const ctx = getAudio(); if (!ctx || !masterGain) return;
  const now = ctx.currentTime + (opts.delay || 0);
  const osc = ctx.createOscillator();
  const g   = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, now);
  if (opts.toFreq) osc.frequency.exponentialRampToValueAtTime(opts.toFreq, now + dur);
  const a = opts.attack ?? 0.01;
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), now + a);
  g.gain.exponentialRampToValueAtTime(0.0001, now + dur);

  if (opts.filter){
    const f = ctx.createBiquadFilter();
    f.type = opts.filter;
    f.frequency.value = opts.filterFreq || 1200;
    osc.connect(g).connect(f).connect(masterGain);
  } else {
    osc.connect(g).connect(masterGain);
  }
  osc.start(now);
  osc.stop(now + dur + 0.05);
}

/* Мини-хелпер: шум */
function playNoise(dur, vol, opts = {}){
  const ctx = getAudio(); if (!ctx || !masterGain) return;
  const now = ctx.currentTime + (opts.delay || 0);
  const len = Math.max(1, Math.floor(ctx.sampleRate * dur));
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const data = buf.getChannelData(0);
  const decay = opts.decay ?? 1;
  for (let i = 0; i < len; i++){
    let v = Math.random()*2 - 1;
    if (decay !== 1) v *= Math.pow(1 - i/len, decay);
    data[i] = v;
  }
  const src = ctx.createBufferSource(); src.buffer = buf;
  const g = ctx.createGain(); g.gain.value = vol;

  if (opts.filterType){
    const f = ctx.createBiquadFilter();
    f.type = opts.filterType;
    f.frequency.setValueAtTime(opts.freqFrom || 1000, now);
    if (opts.freqTo) f.frequency.exponentialRampToValueAtTime(opts.freqTo, now + dur);
    src.connect(g).connect(f).connect(masterGain);
  } else {
    src.connect(g).connect(masterGain);
  }
  src.start(now);
  src.stop(now + dur + 0.05);
}

/* Cooldown-обёртка */
const lastPlayed = {};
function tryPlay(name, cdMs, fn){
  const now = performance.now();
  if (cdMs && lastPlayed[name] && now - lastPlayed[name] < cdMs) return;
  lastPlayed[name] = now;
  fn();
}

/* ================================================================
   ЗВУКИ ВЫСТРЕЛА — массив из 10 вариантов
   Каждый — маленькая функция. Все используют CONFIG.sound.throw.volume.
   ================================================================ */
const THROW_SOUNDS = {

  /* 1. Короткий синус-«поп» 400→150 Гц */
  pop(){
    const v = CONFIG.sound.throw.volume;
    playOsc('sine', 400, 0.12, v, { toFreq: 150, attack: 0.005 });
  },

  /* 2. Резкий щелчок белым шумом через HPF */
  flick(){
    const v = CONFIG.sound.throw.volume;
    playNoise(0.045, v * 1.2, { filterType: 'highpass', freqFrom: 2500, decay: 2 });
  },

  /* 3. Синус вверх-вниз: 200 → 700 → 200 Гц */
  bloop(){
    const ctx = getAudio(); if (!ctx || !masterGain) return;
    const v = CONFIG.sound.throw.volume;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(200, now);
    osc.frequency.exponentialRampToValueAtTime(700, now + 0.06);
    osc.frequency.exponentialRampToValueAtTime(200, now + 0.15);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(v, now + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);
    osc.connect(g).connect(masterGain);
    osc.start(now); osc.stop(now + 0.18);
  },

  /* 4. Свист-шум с BPF 2200→300 Гц */
  thwip(){
    const v = CONFIG.sound.throw.volume;
    playNoise(0.13, v * 0.9, { filterType: 'bandpass', freqFrom: 2200, freqTo: 300, decay: 1.5 });
  },

  /* 5. Низкий квадратный «пуф» 180→75 Гц с LP */
  poot(){
    const v = CONFIG.sound.throw.volume;
    playOsc('square', 180, 0.14, v * 0.7,
      { toFreq: 75, attack: 0.008, filter: 'lowpass', filterFreq: 700 });
  },

  /* 6. Мягкий треугольник 520→200 */
  toss(){
    const v = CONFIG.sound.throw.volume;
    playOsc('triangle', 520, 0.11, v, { toFreq: 200, attack: 0.005 });
  },

  /* 7. Двухслойный шумовой свист */
  swoosh(){
    const v = CONFIG.sound.throw.volume;
    playNoise(0.22, v * 0.8, { filterType: 'bandpass', freqFrom: 600,  freqTo: 1800, decay: 0.8 });
    playNoise(0.22, v * 0.6, { filterType: 'bandpass', freqFrom: 1800, freqTo: 400,  decay: 0.8, delay: 0.05 });
  },

  /* 8. Лазерный «пеу» — пила 1200→220 с LP */
  pew(){
    const v = CONFIG.sound.throw.volume;
    playOsc('sawtooth', 1200, 0.12, v * 0.7,
      { toFreq: 220, attack: 0.003, filter: 'lowpass', filterFreq: 2000 });
  },

  /* 9. Резкий щелчок + клик */
  snap(){
    const v = CONFIG.sound.throw.volume;
    playNoise(0.02, v * 1.1, { decay: 3 });
    playOsc('sine', 800, 0.06, v * 0.5, { toFreq: 200, attack: 0.002 });
  },

  /* 10. Пружинка 300 → 900 → 150 */
  spring(){
    const ctx = getAudio(); if (!ctx || !masterGain) return;
    const v = CONFIG.sound.throw.volume;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(300, now);
    osc.frequency.exponentialRampToValueAtTime(900, now + 0.05);
    osc.frequency.exponentialRampToValueAtTime(150, now + 0.20);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(v, now + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);
    osc.connect(g).connect(masterGain);
    osc.start(now); osc.stop(now + 0.25);
  }
};

/* ---------------- Прочие спец-звуки ---------------- */
const sfx = {
  hit(){
    const v = CONFIG.sound.hit.volume;
    playNoise(0.28, v * 0.8, { filterType:'lowpass', freqFrom: 1200, freqTo: 180, decay: 2.2 });
    playOsc('sine', 200, 0.28, v, { toFreq: 45, attack: 0.01 });
  },
  miss(){
    const v = CONFIG.sound.miss.volume;
    playOsc('sawtooth', 380, 0.15, v, { toFreq: 250, attack: 0.02, filter:'lowpass', filterFreq: 1400 });
    playOsc('sawtooth', 300, 0.16, v, { toFreq: 170, attack: 0.02, delay: 0.14, filter:'lowpass', filterFreq: 1400 });
  },
  airRaid(dur, vol){
    const ctx = getAudio(); if (!ctx || !masterGain) return;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const filt = ctx.createBiquadFilter();
    filt.type = 'lowpass'; filt.frequency.value = 1500;
    osc.type = 'sawtooth';
    const cycle = 1.0;
    for (let t = 0; t < dur; t += cycle){
      osc.frequency.setValueAtTime(450, now + t);
      osc.frequency.linearRampToValueAtTime(820, now + t + cycle*0.5);
      osc.frequency.linearRampToValueAtTime(450, now + t + cycle);
    }
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(vol, now + 0.15);
    g.gain.setValueAtTime(vol, now + Math.max(0.2, dur - 0.5));
    g.gain.linearRampToValueAtTime(0.0001, now + dur);
    osc.connect(filt).connect(g).connect(masterGain);
    osc.start(now);
    osc.stop(now + dur + 0.05);
  },
  samovar(dur, vol){
    const ctx = getAudio(); if (!ctx || !masterGain) return;
    const now = ctx.currentTime;
    const count = Math.floor(dur / 0.22);
    for (let i = 0; i < count; i++){
      const t = now + i * 0.22 + Math.random()*0.08;
      const f = 180 + Math.random()*500;
      const osc = ctx.createOscillator();
      const g   = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f, t);
      osc.frequency.exponentialRampToValueAtTime(f * 0.55, t + 0.14);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      osc.connect(g).connect(masterGain);
      osc.start(t);
      osc.stop(t + 0.18);
    }
  },
  banner(){
    playOsc('triangle', 900, 0.12, CONFIG.sound.banner.volume, { toFreq: 1300 });
    playOsc('sine',    1400, 0.10, CONFIG.sound.banner.volume * 0.6, { delay: 0.05 });
  },
  gameStart(){
    const v = CONFIG.sound.gameStart.volume;
    playOsc('triangle', 300, 0.15, v);
    playOsc('triangle', 400, 0.15, v, { delay: 0.12 });
    playOsc('triangle', 500, 0.15, v, { delay: 0.24 });
    playOsc('triangle', 700, 0.30, v * 1.1, { delay: 0.36 });
  },
  sifaSwap(){
    const v = CONFIG.sound.sifaSwap.volume;
    playOsc('square', 220, 0.08, v * 0.5, { filter:'lowpass', filterFreq: 900 });
    playOsc('square', 440, 0.10, v * 0.4, { delay: 0.06 });
  }
};

/* ---------------- Случайные фоновые звуки ---------------- */
const RANDOM_SOUNDS = {
  blip:   () => playOsc('square',   880, 0.06, CONFIG.sound.random.volume, { attack: 0.005 }),
  beep:   () => playOsc('sine',    1400, 0.12, CONFIG.sound.random.volume),
  whoosh: () => playNoise(0.35, CONFIG.sound.random.volume * 0.7,
              { filterType:'bandpass', freqFrom: 300, freqTo: 2400, decay: 1.2 }),
  boing:  () => playOsc('sine',     500, 0.30, CONFIG.sound.random.volume,
              { toFreq: 70, attack: 0.005 }),
  ping:   () => playOsc('sine',    2000, 0.20, CONFIG.sound.random.volume * 0.8),
  rumble: () => playNoise(0.55, CONFIG.sound.random.volume * 0.6,
              { filterType:'lowpass', freqFrom: 200, freqTo: 80, decay: 1.5 }),
  tick:   () => playNoise(0.02, CONFIG.sound.random.volume * 0.5, { decay: 2 }),
  chime:  () => {
    const v = CONFIG.sound.random.volume;
    playOsc('sine', 880,  0.45, v * 0.7);
    playOsc('sine', 1320, 0.45, v * 0.5, { delay: 0.02 });
    playOsc('sine', 1760, 0.35, v * 0.3, { delay: 0.05 });
  }
};

/* ======================== DOM ======================== */
const stage  = document.getElementById('stage');
const cv     = document.getElementById('cv');
const ctx2d  = cv.getContext('2d');
const hudTxt = document.getElementById('hud-text');
const hudYou = document.getElementById('hud-you');
const msgsEl = document.getElementById('msgs');
const menuEl = document.getElementById('menu');
const sayIn  = document.getElementById('say-input');
const bgm    = document.getElementById('bgm');
const musicBtn = document.getElementById('music-toggle');
const soundBtn = document.getElementById('sound-toggle');

/* ======================== СОСТОЯНИЕ ======================== */
let W = 0, H = 0;
let players = [];
let teamSize = 12;
let holder  = null;
let proj    = null;
let particles = [];
let running = false;
let mouse   = { x: 0, y: 0 };
let mouseDown = false;
const keys  = {};
let chatterTimer = 90;
let shake = 0;

let gameEvent    = null;
let eventCooldown = 600;
let eventFlash    = 0;
let screenHue     = 0;

let banner = null;
let bannerCooldown = 300;

let randomSoundTimer = 0;

let musicOn = true;
bgm.volume = 0;

/* ======================== МУЗЫКА ======================== */
function tryStartMusic(){
  if (!musicOn) return;
  bgm.volume = CONFIG.music.baseVolume;
  const p = bgm.play();
  if (p && p.catch) p.catch(() => {});
}
function stopMusic(){
  bgm.volume = 0;
  bgm.pause();
}
musicBtn.addEventListener('click', e => {
  e.stopPropagation();
  musicOn = !musicOn;
  musicBtn.textContent = musicOn ? '🔊 музыка' : '🔇 музыка';
  musicBtn.classList.toggle('off', !musicOn);
  if (musicOn) tryStartMusic();
  else stopMusic();
});

soundBtn.addEventListener('click', e => {
  e.stopPropagation();
  CONFIG.sound.enabled = !CONFIG.sound.enabled;
  soundBtn.textContent = CONFIG.sound.enabled ? '🔔 звуки' : '🔕 звуки';
  soundBtn.classList.toggle('off', !CONFIG.sound.enabled);
  if (masterGain){
    masterGain.gain.value = CONFIG.sound.enabled ? CONFIG.sound.master : 0;
  }
});

function unlockAudio(){
  getAudio();
  if (musicOn && running) tryStartMusic();
  document.removeEventListener('click', unlockAudio);
  document.removeEventListener('keydown', unlockAudio);
}
document.addEventListener('click', unlockAudio);
document.addEventListener('keydown', unlockAudio);

/* ======================== РАЗМЕР ======================== */
function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  W = w; H = h;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width  = Math.round(w*dpr);
  cv.height = Math.round(h*dpr);
  cv.style.width  = w + 'px';
  cv.style.height = h + 'px';
  ctx2d.setTransform(dpr,0,0,dpr,0,0);
  for (const p of players){
    p.x = clamp(p.x, R, Math.max(R, W-R));
    p.y = clamp(p.y, R, Math.max(R, H-R));
  }
  if (!mouse.x) { mouse.x = W/2; mouse.y = H/2; }
}
new ResizeObserver(resize).observe(stage);

/* ======================== ЧАТ ======================== */
function say(p, text, cls){
  const el = document.createElement('div');
  if (cls === 'sys'){
    el.className = 'sys';
    el.textContent = text;
  } else {
    const b = document.createElement('b');
    b.textContent = p.name + ':';
    b.style.color = `hsl(${p.hue} 85% 72%)`;
    el.appendChild(b);
    el.appendChild(document.createTextNode(' ' + text));
  }
  msgsEl.appendChild(el);
  while (msgsEl.children.length > 80) msgsEl.removeChild(msgsEl.firstChild);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}
sayIn.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const t = sayIn.value.trim();
  if (!t) return;
  const human = players.find(p => p.isHuman);
  if (human) say(human, t);
  sayIn.value = '';
  sayIn.blur();
});

/* ======================== МЕНЮ → СТАРТ ======================== */
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.onclick = () => {
    teamSize = parseInt(btn.dataset.count, 10);
    getAudio();
    startGame();
  };
});

/* ======================== СТАРТ ======================== */
function startGame(){
  const shuffled = shuffle(PAIRS.slice());
  const chosen   = shuffled.slice(0, teamSize);
  const humanIdx = (Math.random() * chosen.length) | 0;

  players = chosen.map((pair, i) => ({
    id: i,
    name: pair.name,
    emoji: pair.emoji,
    isHuman: i === humanIdx,
    x: 0, y: 0, px: 0, py: 0, vx: 0, vy: 0,
    tx: 0, ty: 0, retarget: 0,
    throwCd: 40,
    hue: (i * 137) % 360
  }));

  const cx = W/2, cy = H/2;
  const n  = players.length;
  const maxR = Math.min(W,H) * 0.42;
  const minR = Math.min(W,H) * 0.12;
  players.forEach((p, i) => {
    const a = i * 2.39996 + 0.5;
    const r = minR + (i / Math.max(1, n-1)) * (maxR - minR);
    p.x = clamp(cx + Math.cos(a)*r, R, W-R);
    p.y = clamp(cy + Math.sin(a)*r, R, H-R);
    p.tx = p.x; p.ty = p.y;
  });

  holder  = pick(players);
  proj    = null;
  particles = [];
  gameEvent = null;
  eventCooldown = 10 * 60;
  eventFlash = 0;
  banner = null;
  bannerCooldown = 5 * 60;
  randomSoundTimer = rnd(2, 5) * 60;
  msgsEl.innerHTML = '';
  running = true;
  menuEl.classList.add('hidden');

  const human = players.find(p => p.isHuman);
  say(null, `Игра началась! Игроков: ${n}`, 'sys');
  say(null, `Тебе выпал: ${human.emoji} ${human.name}`, 'sys');
  say(null, `${holder.name} — СИФА!`, 'sys');
  updateHud();
  resize();
  tryStartMusic();
  sfx.gameStart();
}

/* ======================== СОБЫТИЯ ======================== */
function triggerRandomEvent(){
  const type = Math.random() < 0.6 ? 'airraid' : 'samovar';

  if (type === 'airraid'){
    gameEvent = { type: 'airraid', timer: 6 * 60 };
    say(null, '🚨 ВНИМАНИЕ! НАПАДЕНИЕ АЭРОБАНАНА! ВСЕМ В УКРЫТИЕ!', 'sys');
    sfx.airRaid(CONFIG.sound.airRaid.duration, CONFIG.sound.airRaid.volume);
  } else {
    gameEvent = { type: 'samovar', timer: 4 * 60 };
    say(null, '💥 ГОВНА САМОВАР!!!', 'sys');
    sfx.samovar(CONFIG.sound.samovar.duration, CONFIG.sound.samovar.volume);
  }
  eventCooldown = CONFIG.timing.eventMin +
    Math.random() * (CONFIG.timing.eventMax - CONFIG.timing.eventMin);
}

/* ======================== БАННЕРЫ ======================== */
function triggerBanner(){
  const b = pick(BANNERS);
  banner = {
    text:   b.text,
    color:  b.color || '#ffffff',
    effect: b.effect || null,
    timer:  CONFIG.timing.bannerDur,
    total:  CONFIG.timing.bannerDur
  };
  bannerCooldown = CONFIG.timing.bannerMin +
    Math.random() * (CONFIG.timing.bannerMax - CONFIG.timing.bannerMin);
  tryPlay('banner', CONFIG.sound.banner.cooldown, () => sfx.banner());
}

/* ======================== ХИТРОСТИ ======================== */
function updateHud(){
  const human = players.find(p => p.isHuman);
  if (human) hudYou.textContent = `ты: ${human.emoji} ${human.name}`;
  hudTxt.textContent = `💩 ${holder.name} — СИФА!`;
  hudTxt.style.color = holder.isHuman ? '#ffd166' : '#ff8b5a';
}

function nearestTo(p){
  let best = null, bd = Infinity;
  for (const q of players){
    if (q === p) continue;
    const d = (q.x-p.x)**2 + (q.y-p.y)**2;
    if (d < bd){ bd = d; best = q; }
  }
  return best;
}

/* Воспроизвести случайный звук выстрела */
function playThrowSound(){
  const cfg = CONFIG.sound.throw;
  tryPlay('throw', cfg.cooldown, () => {
    const pool = cfg.pool;
    const name = pool[(Math.random() * pool.length) | 0];
    if (THROW_SOUNDS[name]) THROW_SOUNDS[name]();
  });
}

function throwSifa(from, tx, ty){
  const a = Math.atan2(ty - from.y, tx - from.x);
  proj = {
    x: from.x + Math.cos(a) * (R + 6),
    y: from.y + Math.sin(a) * (R + 6),
    vx: Math.cos(a) * SIFA_SPEED,
    vy: Math.sin(a) * SIFA_SPEED,
    owner: from, life: SIFA_LIFE, spin: 0, age: 0
  };
  from.throwCd = 32;
  playThrowSound();   /* ← случайный звук из 10 */
}

function humanThrow(human, mx, my){
  const baseAngle = Math.atan2(my - human.y, mx - human.x);
  let bestTarget = null;
  let bestDiff = AIM_ASSIST_ANGLE;

  for (const p of players){
    if (p === human) continue;
    const dx = p.x - human.x, dy = p.y - human.y;
    const d  = Math.hypot(dx, dy);
    if (d > AIM_ASSIST_RANGE) continue;
    let diff = Math.atan2(dy, dx) - baseAngle;
    while (diff >  Math.PI) diff -= Math.PI*2;
    while (diff < -Math.PI) diff += Math.PI*2;
    const ad = Math.abs(diff);
    if (ad < bestDiff){
      bestDiff = ad;
      const lead = Math.min(d / SIFA_SPEED, 18);
      bestTarget = { x: p.x + p.vx * lead, y: p.y + p.vy * lead };
    }
  }
  if (bestTarget) throwSifa(human, bestTarget.x, bestTarget.y);
  else            throwSifa(human, mx, my);
}

function becomeSifa(p, x, y){
  holder = p;
  proj = null;
  p.throwCd = 42;
  splat(x, y);
  shake = 9;
  tryPlay('hit', CONFIG.sound.hit.cooldown, () => sfx.hit());
  sfx.sifaSwap();
  say(null, `${p.name} — СИФА!`, 'sys');
  updateHud();
}

function splat(x, y, n = 20){
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, sp = rnd(1, 6);
    particles.push({
      x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      life: rnd(20, 55), max: 55, size: rnd(2.5, 8)
    });
  }
}
function poof(x, y){
  for (let i = 0; i < 10; i++){
    const a = Math.random() * Math.PI * 2, sp = rnd(.5, 2.5);
    particles.push({
      x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      life: rnd(15, 30), max: 30, size: rnd(2, 5)
    });
  }
}

/* ======================== ОБНОВЛЕНИЕ ======================== */
function update(dt){
  const human = players.find(p => p.isHuman);

  /* события */
  if (!gameEvent){
    eventCooldown -= dt;
    if (eventCooldown <= 0) triggerRandomEvent();
    if (musicOn) bgm.volume = Math.min(CONFIG.music.baseVolume,
                                       bgm.volume + 0.01*dt);
  } else {
    gameEvent.timer -= dt;
    if (gameEvent.type === 'samovar') eventFlash += dt * 0.3;
    if (musicOn) bgm.volume = Math.max(CONFIG.music.duckedVolume,
                                       bgm.volume - 0.012*dt);
    if (gameEvent.timer <= 0){
      gameEvent = null;
      eventFlash = 0;
    }
  }

  /* баннеры */
  if (!banner && !gameEvent){
    bannerCooldown -= dt;
    if (bannerCooldown <= 0) triggerBanner();
  }
  if (banner){
    banner.timer -= dt;
    if (banner.timer <= 0) banner = null;
  }

  /* случайные фоновые звуки */
  if (CONFIG.sound.random.enabled && running){
    randomSoundTimer -= dt;
    if (randomSoundTimer <= 0){
      const pool = CONFIG.sound.random.pool;
      const name = pool[Math.floor(Math.random() * pool.length)];
      if (RANDOM_SOUNDS[name]) RANDOM_SOUNDS[name]();
      const min = CONFIG.sound.random.minInterval * 60;
      const max = CONFIG.sound.random.maxInterval * 60;
      randomSoundTimer = min + Math.random() * (max - min);
    }
  }

  for (const p of players){ p.px = p.x; p.py = p.y; p.throwCd -= dt; }

  /* человек */
  if (human){
    let ax = 0, ay = 0;
    if (keys['w'] || keys['arrowup'])    ay--;
    if (keys['s'] || keys['arrowdown'])  ay++;
    if (keys['a'] || keys['arrowleft'])  ax--;
    if (keys['d'] || keys['arrowright']) ax++;
    if (ax || ay){
      const l = Math.hypot(ax, ay);
      const sp = human === holder ? SPEED_HOLD : SPEED_RUN;
      human.x += ax/l * sp * dt;
      human.y += ay/l * sp * dt;
    }
    if (human === holder && mouseDown && human.throwCd <= 0 && !proj && !gameEvent){
      humanThrow(human, mouse.x, mouse.y);
    }
  }

  /* ИИ */
  for (const p of players){
    if (p.isHuman) continue;
    const sp = p === holder ? SPEED_HOLD : SPEED_RUN;
    let dx = 0, dy = 0;

    if (gameEvent){
      p.retarget -= dt;
      if (p.retarget <= 0){
        p.tx = rnd(R+20, Math.max(R+21, W-R-20));
        p.ty = rnd(R+20, Math.max(R+21, H-R-20));
        p.retarget = 18 + Math.random()*28;
      }
      const wd = Math.hypot(p.tx-p.x, p.ty-p.y) || 1;
      const boost = gameEvent.type === 'airraid' ? 3.4 : 2.8;
      dx += (p.tx-p.x)/wd * boost;
      dy += (p.ty-p.y)/wd * boost;

      const l = Math.hypot(dx, dy);
      if (l > 0.01){
        p.x += dx/l * sp * dt;
        p.y += dy/l * sp * dt;
      }
      p.x = clamp(p.x, R, W-R);
      p.y = clamp(p.y, R, H-R);
      continue;
    }

    if (p === holder){
      const t = nearestTo(p);
      if (t){
        const d = Math.hypot(t.x-p.x, t.y-p.y) || 1;
        const lead = Math.min(d / SIFA_SPEED, 18);
        const aimX = t.x + t.vx * lead;
        const aimY = t.y + t.vy * lead;
        dx = aimX - p.x;
        dy = aimY - p.y;
        if (p.throwCd <= 0 && d < 360 && !proj){
          const e = 30;
          throwSifa(p, aimX + rnd(-e,e), aimY + rnd(-e,e));
          p.throwCd = 70 + Math.random()*80;
        }
      }
    } else {
      if (holder){
        const d = Math.hypot(p.x-holder.x, p.y-holder.y) || 1;
        if (d < 330){
          dx += (p.x-holder.x)/d * 2.4;
          dy += (p.y-holder.y)/d * 2.4;
        }
      }
      p.retarget -= dt;
      const wd = Math.hypot(p.tx-p.x, p.ty-p.y) || 1;
      if (p.retarget <= 0 || wd < 25){
        p.tx = rnd(R+20, Math.max(R+21, W-R-20));
        p.ty = rnd(R+20, Math.max(R+21, H-R-20));
        p.retarget = 90 + Math.random()*120;
      }
      dx += (p.tx-p.x)/wd * 0.55;
      dy += (p.ty-p.y)/wd * 0.55;

      if (proj && proj.owner !== p){
        const vl = Math.hypot(proj.vx, proj.vy) || 1;
        const nx = proj.vx/vl, ny = proj.vy/vl;
        const rx = p.x - proj.x, ry = p.y - proj.y;
        const along = rx*nx + ry*ny;
        const perp  = rx*(-ny) + ry*nx;
        if (along > 0 && along < AI_DODGE_RADIUS && Math.abs(perp) < AI_DODGE_WIDTH){
          const s = perp > 0 ? 1 : -1;
          dx += -ny * s * AI_DODGE_POWER;
          dy +=  nx * s * AI_DODGE_POWER;
        }
      }
    }

    const l = Math.hypot(dx, dy);
    if (l > 0.01){
      p.x += dx/l * sp * dt;
      p.y += dy/l * sp * dt;
    }
    p.x = clamp(p.x, R, W-R);
    p.y = clamp(p.y, R, H-R);
  }

  for (const p of players){
    p.vx = (p.x - p.px) / dt;
    p.vy = (p.y - p.py) / dt;
  }

  /* полёт сифы */
  if (proj && !gameEvent){
    proj.x += proj.vx * dt;
    proj.y += proj.vy * dt;
    proj.spin += 0.25 * dt;
    proj.life -= dt;
    proj.age  += dt;

    if (proj.x < SR)      { proj.x = SR;     proj.vx =  Math.abs(proj.vx); }
    if (proj.x > W - SR)  { proj.x = W - SR; proj.vx = -Math.abs(proj.vx); }
    if (proj.y < SR)      { proj.y = SR;     proj.vy =  Math.abs(proj.vy); }
    if (proj.y > H - SR)  { proj.y = H - SR; proj.vy = -Math.abs(proj.vy); }

    if (Math.random() < 0.7){
      particles.push({
        x: proj.x + rnd(-4,4), y: proj.y + rnd(-4,4),
        vx: rnd(-.4,.4), vy: rnd(-.4,.4),
        life: 18, max: 18, size: rnd(2,4)
      });
    }

    let hit = false;
    for (const p of players){
      if (p === proj.owner && proj.age < 20) continue;
      if (Math.hypot(p.x-proj.x, p.y-proj.y) < HITBOX){
        const hx = proj.x, hy = proj.y;
        becomeSifa(p, hx, hy);
        hit = true;
        break;
      }
    }

    if (!hit && proj && proj.life <= 0){
      poof(proj.x, proj.y);
      tryPlay('miss', CONFIG.sound.miss.cooldown, () => sfx.miss());
      const owner = proj.owner;
      proj = null;
      if (Math.random() < 0.5) say(owner, 'блин, мимо');
    }
  }

  for (let i = particles.length - 1; i >= 0; i--){
    const pa = particles[i];
    pa.x += pa.vx * dt;
    pa.y += pa.vy * dt;
    pa.vx *= 0.94;
    pa.vy = pa.vy * 0.94 + 0.09 * dt;
    pa.life -= dt;
    if (pa.life <= 0) particles.splice(i, 1);
  }

  chatterTimer -= dt;
  if (chatterTimer <= 0){
    chatterTimer = 70 + Math.random()*110;
    const p = pick(players);
    if (gameEvent){
      const pool = gameEvent.type === 'airraid' ? RAID_PHRASES : SAMOVAR_PHRASES;
      say(p, pick(pool));
    } else {
      say(p, pick(PHRASES));
    }
  }

  if (shake > 0) shake = Math.max(0, shake - dt * 0.8);
  screenHue = (screenHue + dt * 4) % 360;
}

/* ======================== РЕНДЕР ======================== */
function render(){
  ctx2d.clearRect(0, 0, W, H);
  ctx2d.save();
  if (shake > 0) ctx2d.translate(rnd(-shake,shake), rnd(-shake,shake));

  if (gameEvent && gameEvent.type === 'samovar'){
    const hue = (eventFlash * 80) % 360;
    ctx2d.fillStyle = `hsla(${hue}, 85%, 55%, 0.28)`;
    ctx2d.fillRect(-40, -40, W+80, H+80);
  }
  if (gameEvent && gameEvent.type === 'airraid'){
    const pulse = 0.10 + Math.abs(Math.sin(performance.now()/180)) * 0.18;
    ctx2d.fillStyle = `rgba(255, 40, 40, ${pulse})`;
    ctx2d.fillRect(-40, -40, W+80, H+80);
  }

  for (const pa of particles){
    ctx2d.globalAlpha = Math.max(0, pa.life / pa.max);
    ctx2d.fillStyle = '#6b4423';
    ctx2d.beginPath();
    ctx2d.arc(pa.x, pa.y, pa.size, 0, 7);
    ctx2d.fill();
  }
  ctx2d.globalAlpha = 1;

  const human = players.find(p => p.isHuman);
  if (human && human === holder && !proj && !gameEvent){
    ctx2d.beginPath();
    ctx2d.setLineDash([9, 9]);
    ctx2d.moveTo(human.x, human.y);
    ctx2d.lineTo(mouse.x, mouse.y);
    ctx2d.strokeStyle = 'rgba(255,220,120,.45)';
    ctx2d.lineWidth = 3;
    ctx2d.stroke();
    ctx2d.setLineDash([]);

    const baseAngle = Math.atan2(mouse.y - human.y, mouse.x - human.x);
    let bestTarget = null, bestDiff = AIM_ASSIST_ANGLE;
    for (const p of players){
      if (p === human) continue;
      const dx = p.x - human.x, dy = p.y - human.y;
      const d = Math.hypot(dx, dy);
      if (d > AIM_ASSIST_RANGE) continue;
      let diff = Math.atan2(dy, dx) - baseAngle;
      while (diff >  Math.PI) diff -= Math.PI*2;
      while (diff < -Math.PI) diff += Math.PI*2;
      const ad = Math.abs(diff);
      if (ad < bestDiff){ bestDiff = ad; bestTarget = p; }
    }
    if (bestTarget){
      ctx2d.beginPath();
      ctx2d.arc(bestTarget.x, bestTarget.y, R + 16, 0, 7);
      ctx2d.strokeStyle = 'rgba(255,120,120,.9)';
      ctx2d.lineWidth = 3;
      ctx2d.stroke();
    }
  }

  const t = performance.now();
  for (const p of players) drawPlayer(p, t);

  if (proj){
    ctx2d.save();
    ctx2d.translate(proj.x, proj.y);
    ctx2d.rotate(proj.spin);
    ctx2d.font = '30px serif';
    ctx2d.textAlign = 'center';
    ctx2d.textBaseline = 'middle';
    ctx2d.fillText('💩', 0, 0);
    ctx2d.restore();
  }

  drawBanner();
  if (gameEvent) drawEventText();

  ctx2d.restore();
}

function drawBanner(){
  if (!banner) return;
  const { text, timer, total, color, effect } = banner;
  const elapsed = total - timer;

  let alpha = 1;
  if (elapsed < 10)    alpha = elapsed / 10;
  else if (timer < 40) alpha = timer / 40;
  if (alpha < 0) alpha = 0;
  if (alpha > 1) alpha = 1;

  const t = performance.now();
  if (effect === 'flash-right'){
    const a = 0.55 * alpha * Math.max(0, Math.sin(elapsed * 0.7));
    ctx2d.fillStyle = `rgba(255,255,255,${a})`;
    ctx2d.fillRect(W * 0.65, -40, W * 0.4, H + 80);
  } else if (effect === 'flash-left'){
    const a = 0.55 * alpha * Math.max(0, Math.sin(elapsed * 0.7));
    ctx2d.fillStyle = `rgba(255,255,255,${a})`;
    ctx2d.fillRect(-40, -40, W * 0.35, H + 80);
  } else if (effect === 'flash-ahead-red'){
    const a = 0.40 * alpha * Math.abs(Math.sin(elapsed * 0.5));
    ctx2d.fillStyle = `rgba(255,60,60,${a})`;
    ctx2d.fillRect(-40, -40, W + 80, H + 80);
  } else if (effect === 'flash-ahead-blue'){
    const a = 0.40 * alpha * Math.abs(Math.sin(elapsed * 0.5));
    ctx2d.fillStyle = `rgba(60,90,255,${a})`;
    ctx2d.fillRect(-40, -40, W + 80, H + 80);
  } else if (effect === 'sun'){
    const a = 0.45 * alpha;
    const rg = ctx2d.createRadialGradient(W/2, H*0.05, 10, W/2, H*0.05, W*0.55);
    rg.addColorStop(0, `rgba(255,245,180,${a})`);
    rg.addColorStop(0.5, `rgba(255,230,140,${a*0.4})`);
    rg.addColorStop(1, 'rgba(255,230,140,0)');
    ctx2d.fillStyle = rg;
    ctx2d.fillRect(-40, -40, W + 80, H + 80);
  }

  let size = Math.max(20, Math.min(40, W * 0.045));
  ctx2d.font = `900 ${size}px system-ui, "Segoe UI", sans-serif`;
  while (size > 14 && ctx2d.measureText(text).width > W * 0.92){
    size -= 2;
    ctx2d.font = `900 ${size}px system-ui, "Segoe UI", sans-serif`;
  }

  ctx2d.textAlign = 'center';
  ctx2d.textBaseline = 'middle';
  ctx2d.lineWidth = 8;
  ctx2d.strokeStyle = `rgba(0,0,0,${0.9 * alpha})`;

  const x = W / 2;
  const y = 74 + Math.sin(t / 220) * 3;

  ctx2d.strokeText(text, x, y);
  ctx2d.globalAlpha = alpha;
  ctx2d.fillStyle = color;
  ctx2d.fillText(text, x, y);
  ctx2d.globalAlpha = 1;
}

function drawEventText(){
  const isRaid = gameEvent.type === 'airraid';
  const blink  = Math.sin(performance.now() / 110) > 0 ? 1 : 0.35;

  ctx2d.save();
  ctx2d.textAlign = 'center';
  ctx2d.textBaseline = 'middle';

  const title = isRaid ? '🚨 ВНИМАНИЕ! НАПАДЕНИЕ АЭРОБАНАНА! 🚨'
                       : '💥 ГОВНА САМОВАР!!! 💥';
  const sub   = isRaid ? 'ВСЕМ В УКРЫТИЕ!' : 'буль-буль-буль...';

  const mainColor = isRaid
    ? `hsla(0, 100%, 62%, ${blink})`
    : `hsl(${(eventFlash*120)%360}, 95%, 62%)`;

  const boxW = Math.min(W * 0.92, 900);
  const boxH = Math.min(H * 0.28, 180);
  ctx2d.fillStyle = 'rgba(0,0,0,0.55)';
  roundRect(W/2 - boxW/2, H*0.28 - boxH/2, boxW, boxH, 18);
  ctx2d.fill();

  const titleSize = Math.max(22, Math.min(48, W * 0.055));
  ctx2d.font = `900 ${titleSize}px system-ui, "Segoe UI", sans-serif`;
  ctx2d.lineWidth = 8;
  ctx2d.strokeStyle = 'rgba(0,0,0,0.9)';
  ctx2d.strokeText(title, W/2, H*0.28 - titleSize*0.4);
  ctx2d.fillStyle = mainColor;
  ctx2d.fillText(title, W/2, H*0.28 - titleSize*0.4);

  const subSize = Math.max(16, Math.min(28, W * 0.032));
  ctx2d.font = `800 ${subSize}px system-ui, sans-serif`;
  ctx2d.lineWidth = 6;
  ctx2d.strokeStyle = 'rgba(0,0,0,0.9)';
  ctx2d.strokeText(sub, W/2, H*0.28 + titleSize*0.7);
  ctx2d.fillStyle = isRaid ? '#ffd166' : '#ffffff';
  ctx2d.fillText(sub, W/2, H*0.28 + titleSize*0.7);

  const total = isRaid ? 6*60 : 4*60;
  const prog  = clamp(gameEvent.timer / total, 0, 1);
  const barW  = boxW * 0.7;
  const barX  = W/2 - barW/2;
  const barY  = H*0.28 + boxH*0.35;
  ctx2d.fillStyle = 'rgba(255,255,255,0.15)';
  roundRect(barX, barY, barW, 8, 4); ctx2d.fill();
  ctx2d.fillStyle = isRaid ? '#ff5555' : `hsl(${(eventFlash*120)%360}, 90%, 60%)`;
  roundRect(barX, barY, barW * prog, 8, 4); ctx2d.fill();

  ctx2d.restore();
}

function roundRect(x, y, w, h, r){
  ctx2d.beginPath();
  ctx2d.moveTo(x + r, y);
  ctx2d.arcTo(x + w, y,     x + w, y + h, r);
  ctx2d.arcTo(x + w, y + h, x,     y + h, r);
  ctx2d.arcTo(x,     y + h, x,     y,     r);
  ctx2d.arcTo(x,     y,     x + w, y,     r);
  ctx2d.closePath();
}

function drawPlayer(p, t){
  ctx2d.beginPath();
  ctx2d.ellipse(p.x, p.y + R*0.9, R*0.85, R*0.32, 0, 0, 7);
  ctx2d.fillStyle = 'rgba(0,0,0,.35)';
  ctx2d.fill();

  if (p === holder){
    const pulse = 1 + Math.sin(t/160) * 0.12;
    ctx2d.beginPath();
    ctx2d.arc(p.x, p.y, (R + 12) * pulse, 0, 7);
    ctx2d.strokeStyle = 'rgba(200,130,50,.55)';
    ctx2d.lineWidth = 4;
    ctx2d.stroke();
  }

  ctx2d.beginPath();
  ctx2d.arc(p.x, p.y, R, 0, 7);
  const g = ctx2d.createRadialGradient(p.x-8, p.y-10, 3, p.x, p.y, R);
  g.addColorStop(0, `hsl(${p.hue} 70% 62%)`);
  g.addColorStop(1, `hsl(${p.hue} 60% 36%)`);
  ctx2d.fillStyle = g;
  ctx2d.fill();
  ctx2d.lineWidth = p.isHuman ? 4 : 2;
  ctx2d.strokeStyle = p.isHuman ? '#ffffff' : 'rgba(0,0,0,.45)';
  ctx2d.stroke();

  ctx2d.font = '26px serif';
  ctx2d.textAlign = 'center';
  ctx2d.textBaseline = 'middle';
  ctx2d.fillText(p.emoji, p.x, p.y + 2);

  const dn = shortName(p.name);
  const fsize = dn.length > 10 ? 11 : 13;
  ctx2d.font = `bold ${fsize}px system-ui, sans-serif`;
  ctx2d.lineWidth = 3;
  ctx2d.strokeStyle = 'rgba(0,0,0,.85)';
  ctx2d.strokeText(dn, p.x, p.y + R + 15);
  ctx2d.fillStyle = p.isHuman ? '#ffe08a' : '#f0f0f0';
  ctx2d.fillText(dn, p.x, p.y + R + 15);

  if (p === holder){
    const bob = Math.sin(t/200) * 4;
    ctx2d.font = '30px serif';
    ctx2d.fillText('💩', p.x, p.y - R - 22 + bob);
  }
}

/* ======================== ЦИКЛ ======================== */
let lastT = performance.now();
function loop(now){
  let dt = (now - lastT) / 16.6667;
  lastT = now;
  dt = Math.min(dt, 2.5);
  if (running) update(dt);
  render();
  requestAnimationFrame(loop);
}

/* ======================== ВВОД ======================== */
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
});
window.addEventListener('keyup', e => {
  if (e.target.tagName === 'INPUT') return;
  keys[e.key.toLowerCase()] = false;
});
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouseDown = false; });

cv.addEventListener('mousemove', e => {
  const r = cv.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (W / r.width);
  mouse.y = (e.clientY - r.top)  * (H / r.height);
});
cv.addEventListener('mousedown', e => { e.preventDefault(); mouseDown = true; });
window.addEventListener('mouseup', () => { mouseDown = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());

/* ======================== ПОЕХАЛИ ======================== */
resize();
requestAnimationFrame(loop);

})();
</script>
